name: CI and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Check package
        run: cargo publish --dry-run

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.70
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.70.0
      - name: Check minimum supported Rust version
        run: cargo check --all-features

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check public API compatibility
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, msrv, semver]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
              --jq '.object.sha'
          )"
          verified="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
              --jq '.verification.verified'
          )"
          test "${verified}" = "true"
      - name: Match tag to crate version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${crate_version}" = "${GITHUB_REF_NAME}"
      - name: Release Crate
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          crate_name="$(jq -r '.packages[0].name' <<<"${metadata}")"
          crate_version="$(jq -r '.packages[0].version' <<<"${metadata}")"
          registry_status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --retry 3 \
              --user-agent "${GITHUB_REPOSITORY} release workflow" \
              "https://crates.io/api/v1/crates/${crate_name}/${crate_version}"
          )"
          case "${registry_status}" in
            200)
              echo "${crate_name} ${crate_version} is already published"
              ;;
            404)
              cargo publish --token "${{ secrets.CARGO_PUBLISH_TOKEN }}"
              ;;
            *)
              echo "crates.io returned HTTP ${registry_status}" >&2
              exit 1
              ;;
          esac

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --verify-tag \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --latest
          fi
